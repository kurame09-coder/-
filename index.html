<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Багшийн бүртгэл</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Багшийн бүртгэл</h1>

    <button id="adminBtn">Админ нэвтрэх</button>

    <form id="teacherForm">
        <input type="text" id="name" placeholder="Нэр" required>
        <input type="text" id="profession" placeholder="Мэргэжил" required>
        <input type="text" id="phone" placeholder="Утас (8 оронтой)" required>
        <button type="submit">Нэмэх</button>
    </form>

    <div id="teacherContainer"></div>

    <script src="script.js"></script>
</body>
</html>
